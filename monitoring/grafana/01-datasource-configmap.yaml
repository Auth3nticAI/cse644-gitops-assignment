# CSE644 Assignment 03, Requirement 5: provisions the Prometheus datasource
# automatically at container start (Grafana's file-based provisioning),
# so there is no manual "click through the UI to add a datasource" step
# that would fall outside GitOps management.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
