# CSE644 Assignment 03, Requirement 5: Grafana admin credentials.
# DUMMY value only, same treatment as k8s/13-python-secret.yaml - not a
# real credential, safe to commit, and irrelevant outside this local
# port-forwarded KinD cluster. Kubernetes Secrets are base64-ENCODED, not
# encrypted, in etcd by default; see README for that disclosure.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: "cse644-demo-not-a-real-password"
