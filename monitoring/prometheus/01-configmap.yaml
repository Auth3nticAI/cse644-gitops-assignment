# CSE644 Assignment 03, Requirement 5: scrape configuration.
# Static targets rather than Kubernetes service-discovery + RBAC: this
# platform has exactly one metrics-emitting workload (python-web), so
# kubernetes_sd_configs and the ClusterRole it needs would be pure overhead
# for a small local cluster. Prometheus also scrapes its own /metrics.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: python-web
        metrics_path: /metrics
        static_configs:
          - targets: ["python-web-svc.cse644.svc.cluster.local:8888"]
            labels:
              app: python-web
              assignment: "03"
